<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flutter Integration Test Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .stack-trace-collapsed {
      max-height: 3.6em; /* approx. 2 lines */
      overflow: hidden;
    }
    .toggle-btn {
      cursor: pointer;
      color: #2563eb; /* Tailwind blue-600 */
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    /* Striped table rows for better readability */
    tbody tr:nth-child(even) {
      background-color: #f9fafb;
    }
    /* Hover effect for table rows */
    tbody tr:hover {
      background-color: #f3f4f6;
    }
    /* Make table responsive */
    @media (max-width: 768px) {
      table {
        font-size: 0.875rem;
      }
      th, td {
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">📊 Flutter Integration Test Report</h1>

    <div id="summary" class="mb-6 text-lg"></div>
    <div id="report"></div>
  </div>

  <script>
    // Screenshot modal functionality
    function openScreenshotModal(imageSrc) {
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50';
      modal.onclick = () => document.body.removeChild(modal);
      
      modal.innerHTML = 
        '<div class="max-w-4xl max-h-full p-4">' +
          '<img src="' + imageSrc + '" alt="Full size screenshot" class="max-w-full max-h-full object-contain" />' +
          '<div class="text-center mt-4">' +
            '<button onclick="this.parentElement.parentElement.parentElement.click()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Close</button>' +
          '</div>' +
        '</div>';
      
      document.body.appendChild(modal);
    }

    // Escape HTML
    function escapeHtml(str) {
      return (str || '').toString()
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // Format matcher-style reason into clearer sections
    function formatReason(reason) {
      if (!reason) return '';
      const text = reason.toString();
      const lines = text.split('\n');
      const expectedLine = lines.find(l => l.trim().startsWith('Expected:')) || '';
      const actualLine   = lines.find(l => l.trim().startsWith('  Actual:')) || '';
      const whichLine    = lines.find(l => l.trim().startsWith('   Which:')) || '';

      // If we detect Expected/Actual/Which, render structured view
      if (expectedLine || actualLine || whichLine) {
        const expected = escapeHtml(expectedLine.replace(/^s*Expected:s*/, ''));
        const actual = escapeHtml(actualLine.replace(/^s*Actual:s*/, ''));
        const which = escapeHtml(whichLine.replace(/^s*Which:s*/, ''));

        let html = '<div class="mt-1 text-sm space-y-1">';
        if (expected) {
          html += '<div><span class="font-medium">Expected:</span> <code class="bg-gray-100 px-1 py-0.5 rounded">' + expected + '</code></div>';
        }
        if (actual) {
          html += '<div><span class="font-medium">Actual:</span> <code class="bg-gray-100 px-1 py-0.5 rounded">' + actual + '</code></div>';
        }
        if (which) {
          html += '<div><span class="font-medium">Why:</span> ' + which + '</div>';
        }
        // Show the rest (if any) in a compact pre block
        const rest = lines.filter(l => !l.trim().startsWith('Expected:') && !l.trim().startsWith('Actual:') && !l.trim().startsWith('Which:')).join('\n').trim();
        if (rest) {
          html += '<pre class="bg-gray-100 rounded p-2 whitespace-pre-wrap text-xs">' + escapeHtml(rest) + '</pre>';
        }
        html += '</div>';
        return html;
      }

      // Default: preserve line breaks
      return '<pre class="bg-gray-100 rounded p-2 whitespace-pre-wrap text-sm">' + escapeHtml(text) + '</pre>';
    }
    
    const data = {"results":[{"testName":"Anoother Group Test Case Two","suite":"smoke Tests","status":"passed","reason":"","expectFailed":[],"stackTrace":"","filePath":null,"lineNumber":null,"screenshotPath":null}]};

    const grouped = {};
    data.results.forEach(test => {
      const suite = test.suite || "Default Suite";
      if (!grouped[suite]) grouped[suite] = [];
      grouped[suite].push(test);
    });

    const reportDiv = document.getElementById("report");
    const summaryDiv = document.getElementById("summary");

    const total = data.results.length;
    const passed = data.results.filter(t => t.status === "passed").length;
    const failed = data.results.filter(t => t.status === "failed").length;
    const passPercent = ((passed / total) * 100).toFixed(1);

    summaryDiv.innerHTML = 
      '<div class="sticky top-0 bg-white border-b border-gray-200 shadow-sm mb-8">' +
        '<div class="max-w-7xl mx-auto px-4 py-6">' +
          '<div class="flex items-center justify-between mb-6">' +
            '<div>' +
              '<h2 class="text-2xl font-bold text-gray-900">Test Results Summary</h2>' +
              '<p class="text-gray-600 mt-1">Generated on ' + new Date().toLocaleString() + '</p>' +
            '</div>' +
            '<div class="text-right">' +
              '<div class="text-3xl font-bold text-gray-900">' + passPercent + '%</div>' +
              '<div class="text-sm text-gray-600">Pass Rate</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">' +
            '<div class="bg-white border border-gray-200 rounded-lg p-4 text-center">' +
              '<div class="text-3xl font-bold text-gray-900">' + total + '</div>' +
              '<div class="text-sm text-gray-600">Total Tests</div>' +
            '</div>' +
            '<div class="bg-green-50 border border-green-200 rounded-lg p-4 text-center">' +
              '<div class="text-3xl font-bold text-green-600">' + passed + '</div>' +
              '<div class="text-sm text-green-700">✅ Passed</div>' +
            '</div>' +
            '<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-center">' +
              '<div class="text-3xl font-bold text-red-600">' + failed + '</div>' +
              '<div class="text-sm text-red-700">❌ Failed</div>' +
            '</div>' +
            '<div class="bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">' +
              '<div class="text-3xl font-bold text-blue-600">' + Object.keys(grouped).length + '</div>' +
              '<div class="text-sm text-blue-700">📦 Test Suites</div>' +
            '</div>' +
          '</div>' +
          
          '<div class="bg-gray-50 rounded-lg p-4">' +
            '<div class="flex items-center justify-between mb-2">' +
              '<span class="text-sm font-medium text-gray-700">Progress</span>' +
              '<span class="text-sm text-gray-600">' + passed + ' of ' + total + ' tests passed</span>' +
            '</div>' +
            '<div class="w-full bg-gray-200 rounded-full h-3">' +
              '<div class="bg-gradient-to-r from-green-400 to-green-600 h-3 rounded-full transition-all duration-500" style="width: ' + passPercent + '%"></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    let testIndex = 0;
    let globalTestNumber = 0;
    Object.entries(grouped).forEach(([suite, tests]) => {
      const passed = tests.filter(t => t.status === "passed");
      const failed = tests.filter(t => t.status === "failed");
      const totalTests = tests.length;
      const hasFailure = failed.length > 0;

      const suiteSection = document.createElement("details");
      suiteSection.className = "mb-8 p-4 rounded shadow border " + (hasFailure ? 'bg-red-50 border-red-400' : 'bg-green-50 border-green-300');
      suiteSection.open = hasFailure; // open if failed, else collapsed

      const suiteTitle = document.createElement("summary");
      suiteTitle.className = "cursor-pointer text-xl font-semibold mb-2 " + (hasFailure ? 'text-red-600' : 'text-green-700');
      suiteTitle.innerHTML = '📦 Suite: ' + suite + ' <span class="text-sm font-normal text-gray-600">(' + totalTests + ' Test' + (totalTests !== 1 ? 's' : '') + ')</span>';
      suiteSection.appendChild(suiteTitle);

      // Create a table instead of list
      let htmlBody = '<div class="overflow-x-auto mt-4">' +
        '<table class="min-w-full bg-white border border-gray-300 rounded-lg">' +
        '<thead class="bg-gray-200">' +
        '<tr>' +
        '<th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b">Sr No</th>' +
        '<th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b">Description</th>' +
        '<th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b">Status</th>' +
        '<th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b">Error</th>' +
        '</tr>' +
        '</thead>' +
        '<tbody class="divide-y divide-gray-200">';
      
      tests.forEach((test, index) => {
        globalTestNumber++;
        const testNumber = globalTestNumber;
        
        if (test.status === 'passed') {
          htmlBody += '<tr>' +
            '<td class="px-4 py-3 text-sm font-medium text-gray-900">' + testNumber + '</td>' +
            '<td class="px-4 py-3 text-sm text-gray-900">' + test.testName + '</td>' +
            '<td class="px-4 py-3 text-sm"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">✅ Passed</span></td>' +
            '<td class="px-4 py-3 text-sm text-gray-500">-</td>' +
            '</tr>';
        } else {
          // New: render each failed expect independently if present
          const failures = Array.isArray(test.expectFailed) ? test.expectFailed : [];
          
          // Start the failed test row
          htmlBody += '<tr class="bg-red-50">' +
            '<td class="px-4 py-3 text-sm font-medium text-gray-900 align-top">' + testNumber + '</td>' +
            '<td class="px-4 py-3 text-sm text-gray-900 align-top font-medium">' + test.testName + '</td>' +
            '<td class="px-4 py-3 text-sm align-top"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">❌ Failed</span></td>' +
            '<td class="px-4 py-3 text-sm align-top">' +
            '<div class="space-y-2">';

          if (failures.length > 0) {
            failures.forEach((f, fIndex) => {
              const preId = 'trace-' + (testIndex++);
              const fullStack = (f.stackTrace || '').toString();
              const shortStack = fullStack.split('\n').slice(0, 2).join('\n');
              const hasLocation = !!(f.filePath && f.lineNumber);

              if (fIndex > 0) htmlBody += '<hr class="my-2 border-gray-300">';
              
              htmlBody += '<div class="mb-2">';
              if (f.reason) {
                htmlBody += '<div class="text-red-700 font-medium mb-1">• ' + escapeHtml(f.reason.toString().split('\n')[0]) + '</div>';
              }
              if (hasLocation) {
                htmlBody += '<div class="flex items-center gap-2 mt-1">' +
                  '<button onclick="navigateToTest(\'' + f.filePath + '\', ' + f.lineNumber + ')" ' +
                  'class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded text-xs transition-colors">' +
                  '🔍 Line ' + f.lineNumber +
                  '</button>' +
                  '<span class="text-xs text-gray-600">' + f.filePath + '</span>' +
                '</div>';
              }
              if (fullStack) {
                htmlBody += '<details class="mt-1"><summary class="text-xs text-blue-600 cursor-pointer hover:text-blue-800">📄 View stack trace</summary>' +
                  '<pre class="bg-gray-100 p-2 rounded text-xs mt-1 whitespace-pre-wrap overflow-auto max-h-32">' + escapeHtml(fullStack) + '</pre></details>';
              }
              htmlBody += '</div>';
            });
          } else {
            // Fallback legacy single error rendering
            const preId = 'trace-' + (testIndex++);
            const fullStack = (test.stackTrace || '').toString();
            const hasLocation = !!(test.filePath && test.lineNumber);
            
            if (test.reason) {
              htmlBody += '<div class="text-red-700 font-medium mb-1">' + escapeHtml(test.reason.toString().split('\n')[0]) + '</div>';
            }
            if (hasLocation) {
              htmlBody += '<div class="flex items-center gap-2 mt-1">' +
                '<button onclick="navigateToTest(\'' + test.filePath + '\', ' + test.lineNumber + ')" ' +
                'class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded text-xs transition-colors">' +
                '🔍 Line ' + test.lineNumber +
                '</button>' +
                '<span class="text-xs text-gray-600">' + test.filePath + '</span>' +
              '</div>';
            }
            if (fullStack) {
              htmlBody += '<details class="mt-1"><summary class="text-xs text-blue-600 cursor-pointer hover:text-blue-800">📄 View stack trace</summary>' +
                '<pre class="bg-gray-100 p-2 rounded text-xs mt-1 whitespace-pre-wrap overflow-auto max-h-32">' + escapeHtml(fullStack) + '</pre></details>';
            }
          }

          // Screenshot if available
          if (test.screenshotPath) {
            htmlBody += 
              '<div class="mt-2">' +
                '<details><summary class="text-xs text-blue-600 cursor-pointer hover:text-blue-800">📸 View screenshot</summary>' +
                '<div class="border border-gray-300 rounded-lg overflow-hidden mt-2">' +
                  '<img src="' + test.screenshotPath + '" alt="Test failure screenshot" class="w-full max-w-sm cursor-pointer hover:opacity-90 transition-opacity" onclick="openScreenshotModal(this.src)" />' +
                '</div></details>' +
              '</div>';
          }

          htmlBody += '</div></td></tr>';
        }
      });
      
      htmlBody += '</tbody></table></div>';

      suiteSection.insertAdjacentHTML('beforeend', htmlBody);
      reportDiv.appendChild(suiteSection);
    });

    function navigateToTest(filePath, lineNumber) {
      // Get the current HTML file's location to construct absolute path
      const currentLocation = window.location.href;
      const htmlFileIndex = currentLocation.lastIndexOf('/');
      const basePath = currentLocation.substring(0, htmlFileIndex);
      
      // Go up one level from testmate folder to get project root
      const projectRootIndex = basePath.lastIndexOf('/testmate');
      const projectRoot = projectRootIndex !== -1 
          ? basePath.substring(0, projectRootIndex)
          : basePath;
      
      // Convert file:// URL to regular file path
      let absolutePath = projectRoot + '/' + filePath;
      
      // Remove file:// protocol if present
      if (absolutePath.startsWith('file://')) {
        absolutePath = absolutePath.substring(7); // Remove 'file://'
      }
      
      // Handle macOS file:// URLs (they have an extra slash)
      if (absolutePath.startsWith('//')) {
        absolutePath = absolutePath.substring(1); // Remove extra slash
      }
      
      console.log('Current location:', currentLocation);
      console.log('Project root:', projectRoot);
      console.log('Absolute path:', absolutePath);
      
      // Try different IDE protocols
      const protocols = [
        // Cursor IDE (primary)
        'cursor://file/' + encodeURIComponent(absolutePath) + ':' + lineNumber,
        // VS Code
        'vscode://file/' + encodeURIComponent(absolutePath) + ':' + lineNumber,
        // IntelliJ IDEA / Android Studio
        'idea://open?file=' + encodeURIComponent(absolutePath) + '&line=' + lineNumber,
        // Sublime Text
        'subl://' + encodeURIComponent(absolutePath) + ':' + lineNumber,
        // Atom
        'atom://open?url=file://' + encodeURIComponent(absolutePath) + '&line=' + lineNumber,
        // Vim (if using vim-remote)
        'vim://' + encodeURIComponent(absolutePath) + ':' + lineNumber
      ];

      // Try to open with the first available protocol
      let opened = false;
      for (const protocol of protocols) {
        try {
          window.open(protocol, '_blank');
          opened = true;
          console.log('Attempting to open: ' + protocol);
          break;
        } catch (e) {
          console.log('Failed to open with ' + protocol + ':', e);
        }
      }

      if (!opened) {
        // Fallback: Show file path and line number for manual navigation
        alert('Unable to open IDE automatically.\n\nFile: ' + filePath + '\nLine: ' + lineNumber + '\n\nPlease open this file manually in your IDE.');
      }
    }
  </script>
</body>
</html>
