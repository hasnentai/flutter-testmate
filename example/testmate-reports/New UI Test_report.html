<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flutter Integration Test Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .stack-trace-collapsed {
      max-height: 3.6em; /* approx. 2 lines */
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stack-trace-expanded {
      max-height: none;
      white-space: pre-wrap;
    }
    .screenshot-thumbnail {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .screenshot-thumbnail:hover {
      transform: scale(1.05);
    }
    .sidebar {
      transition: transform 0.3s ease-in-out;
    }
    .sidebar-hidden {
      transform: translateX(-100%);
    }
    .content-shifted {
      margin-left: 0;
    }
    .nav-item {
      transition: all 0.2s ease;
    }
    .nav-item:hover {
      background-color: #f3f4f6;
    }
    .nav-item.active {
      background-color: #3b82f6;
      color: white;
    }
    .section {
      display: none;
    }
    .section.active {
      display: block;
    }
    .table-container {
      overflow-x: auto;
    }
    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-passed {
      background-color: #dcfce7;
      color: #166534;
    }
    .status-failed {
      background-color: #fef2f2;
      color: #dc2626;
    }
    /* Striped table rows for better readability */
    tbody tr:nth-child(even) {
      background-color: #f9fafb;
    }
    /* Hover effect for table rows */
    tbody tr:hover {
      background-color: #f3f4f6;
    }
    /* Make table responsive */
    @media (max-width: 768px) {
      table {
        font-size: 0.875rem;
      }
      th, td {
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Mobile menu button -->
  <div class="lg:hidden fixed top-4 left-4 z-50">
    <button id="mobile-menu-btn" class="bg-white p-2 rounded-md shadow-md">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <!-- Sidebar -->
  <div id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white shadow-lg sidebar lg:translate-x-0">
    <div class="flex items-center justify-between h-16 px-6 border-b border-gray-200">
      <h1 class="text-xl font-bold text-gray-900">📊 Test Report</h1>
    </div>
    
    <nav class="mt-6">
      <div class="px-3 space-y-1">
        <a href="#" class="nav-item active flex items-center px-3 py-2 text-sm font-medium rounded-md" data-section="overview">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
          Overview
        </a>
        <a href="#" class="nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md" data-section="tests">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          All Tests
        </a>
        <a href="#" class="nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md" data-section="failed">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
          </svg>
          Failed Tests
        </a>
        <a href="#" class="nav-item flex items-center px-3 py-2 text-sm font-medium rounded-md" data-section="suites-detail">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
          Suite Details
        </a>
      </div>
    </nav>
  </div>

  <!-- Main content -->
  <div id="main-content" class="lg:ml-64 min-h-screen">
    <div class="p-6">
      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Flutter Integration Test Report</h1>
        <p class="text-gray-600" id="report-timestamp">Generated on: Loading...</p>
      </div>

      <!-- Overview Section -->
      <div id="overview-section" class="section active">
        <div id="summary"></div>
      </div>


      <!-- All Tests Section -->
      <div id="tests-section" class="section">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-900">All Tests</h2>
          </div>
          <div class="p-6">
            <div id="tests-table" class="table-container">
              <!-- Tests table will be populated here -->
            </div>
          </div>
        </div>
      </div>

      <!-- Failed Tests Section -->
      <div id="failed-section" class="section">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-900">Failed Tests</h2>
          </div>
          <div class="p-6">
            <div id="failed-table" class="table-container">
              <!-- Failed tests table will be populated here -->
            </div>
          </div>
        </div>
      </div>

      <!-- Suite Details Section -->
      <div id="suites-detail-section" class="section">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-900">Test Suite Summary</h2>
            <p class="text-sm text-gray-600 mt-1">Overview of all test suites with detailed breakdown</p>
          </div>
          <div class="p-6">
            <div id="suites-summary-table" class="table-container">
              <!-- Suite summary table will be populated here -->
            </div>
          </div>
        </div>
        
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-900">Test Suite Details</h2>
            <p class="text-sm text-gray-600 mt-1">Expandable sections showing all tests within each suite</p>
          </div>
          <div class="p-6">
            <div id="suites-detail-content">
              <!-- Expandable suite sections will be populated here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Dashboard functionality
    let testData = null;
    
    // Mobile menu toggle
    document.getElementById('mobile-menu-btn').addEventListener('click', function() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('sidebar-hidden');
    });
    
    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        
        // Remove active class from all nav items
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        // Add active class to clicked item
        this.classList.add('active');
        
        // Hide all sections
        document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
        // Show selected section
        const targetSection = this.getAttribute('data-section');
        document.getElementById(targetSection + '-section').classList.add('active');
      });
    });
    
    // Screenshot modal functionality
    function openScreenshotModal(imageSrc) {
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50';
      modal.onclick = () => document.body.removeChild(modal);
      
      modal.innerHTML = 
        '<div class="max-w-4xl max-h-full p-4">' +
          '<img src="' + imageSrc + '" alt="Full size screenshot" class="max-w-full max-h-full object-contain" />' +
          '<div class="text-center mt-4">' +
            '<button onclick="this.parentElement.parentElement.parentElement.click()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Close</button>' +
          '</div>' +
        '</div>';
      
      document.body.appendChild(modal);
    }

    // Escape HTML
    function escapeHtml(str) {
      return (str || '').toString()
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // Format matcher-style reason into clearer sections
    function formatReason(reason) {
      if (!reason) return '';
      const text = reason.toString();
      const lines = text.split('\n');
      const expectedLine = lines.find(l => l.trim().startsWith('Expected:')) || '';
      const actualLine   = lines.find(l => l.trim().startsWith('  Actual:')) || '';
      const whichLine    = lines.find(l => l.trim().startsWith('   Which:')) || '';

      // If we detect Expected/Actual/Which, render structured view
      if (expectedLine || actualLine || whichLine) {
        const expected = escapeHtml(expectedLine.replace(/^s*Expected:s*/, ''));
        const actual = escapeHtml(actualLine.replace(/^s*Actual:s*/, ''));
        const which = escapeHtml(whichLine.replace(/^s*Which:s*/, ''));

        let html = '<div class="mt-1 text-sm space-y-1">';
        if (expected) {
          html += '<div><span class="font-medium">Expected:</span> <code class="bg-gray-100 px-1 py-0.5 rounded">' + expected + '</code></div>';
        }
        if (actual) {
          html += '<div><span class="font-medium">Actual:</span> <code class="bg-gray-100 px-1 py-0.5 rounded">' + actual + '</code></div>';
        }
        if (which) {
          html += '<div><span class="font-medium">Why:</span> ' + which + '</div>';
        }
        // Show the rest (if any) in a compact pre block
        const rest = lines.filter(l => !l.trim().startsWith('Expected:') && !l.trim().startsWith('Actual:') && !l.trim().startsWith('Which:')).join('\n').trim();
        if (rest) {
          html += '<pre class="bg-gray-100 rounded p-2 whitespace-pre-wrap text-xs">' + escapeHtml(rest) + '</pre>';
        }
        html += '</div>';
        return html;
      }

      // Default: preserve line breaks
      return '<pre class="bg-gray-100 rounded p-2 whitespace-pre-wrap text-sm">' + escapeHtml(text) + '</pre>';
    }
    
    // Initialize dashboard
    testData = {"results":[{"testName":"Anoother Group Test Case Two","suite":"smoke Tests","status":"passed","reason":"","expectFailed":[],"stackTrace":"","filePath":null,"lineNumber":null,"screenshotPath":null,"duration":4443},{"testName":"Anoother Group Test Case Two","suite":"smoke Tests","status":"passed","reason":"","expectFailed":[],"stackTrace":"","filePath":null,"lineNumber":null,"screenshotPath":null,"duration":4191}]};
    
    // Group tests by suite
    const grouped = {};
    testData.results.forEach(test => {
      const suite = test.suite || "Default Suite";
      if (!grouped[suite]) grouped[suite] = [];
      grouped[suite].push(test);
    });

    const total = testData.results.length;
    const passed = testData.results.filter(t => t.status === "passed").length;
    const failed = testData.results.filter(t => t.status === "failed").length;
    const passPercent = ((passed / total) * 100).toFixed(1);
    
    // Set timestamp
    document.getElementById('report-timestamp').textContent = 'Generated on: ' + new Date().toLocaleString();
    
    // Initialize all dashboard sections
    initializeOverview();
    initializeTestsTable();
    initializeFailedTable();
    initializeSuitesDetail();
    
    function calculateTotalDuration() {
      let totalMs = 0;
      testData.results.forEach(test => {
        if (test.duration !== undefined && test.duration !== null) {
          totalMs += test.duration;
        }
      });
      
      if (totalMs === 0) {
        return "N/A";
      }
      
      const totalSeconds = totalMs / 1000;
      
      if (totalSeconds < 60) {
        return totalSeconds.toFixed(1) + "s";
      } else if (totalSeconds < 3600) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = (totalSeconds % 60).toFixed(1);
        return minutes + "m " + seconds + "s";
      } else {
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = (totalSeconds % 60).toFixed(1);
        return hours + "h " + minutes + "m " + seconds + "s";
      }
    }
    
    function initializeOverview() {
      const summaryDiv = document.getElementById("summary");
      summaryDiv.innerHTML = 
        '<div class="flex flex-wrap gap-6 mb-8">' +
          '<div class="bg-red-50 border border-red-200 rounded-lg p-6 flex-1 min-w-64 shadow-sm">' +
            '<div class="flex items-center justify-between">' +
              '<div>' +
                '<h3 class="text-sm font-medium text-red-800 mb-2">Total Failures</h3>' +
                '<div class="text-4xl font-bold text-red-900 mb-1">' + failed + '</div>' +
                '<div class="text-sm text-red-700">' + ((failed / total) * 100).toFixed(1) + '% of all tests</div>' +
              '</div>' +
              '<div class="w-12 h-12 bg-red-500 rounded-full flex items-center justify-center">' +
                '<svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">' +
                  '<path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>' +
                '</svg>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="bg-green-50 border border-green-200 rounded-lg p-6 flex-1 min-w-64 shadow-sm">' +
            '<div class="flex items-center justify-between">' +
              '<div>' +
                '<h3 class="text-sm font-medium text-green-800 mb-2">Passed Tests</h3>' +
                '<div class="text-4xl font-bold text-green-900 mb-1">' + passed + '</div>' +
                '<div class="text-sm text-green-700">' + ((passed / total) * 100).toFixed(1) + '% of all tests</div>' +
              '</div>' +
              '<div class="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center">' +
                '<svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">' +
                  '<path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>' +
                '</svg>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="bg-blue-50 border border-blue-200 rounded-lg p-6 flex-1 min-w-64 shadow-sm">' +
            '<div class="flex items-center justify-between">' +
              '<div>' +
                '<h3 class="text-sm font-medium text-blue-800 mb-2">Test Suites</h3>' +
                '<div class="text-4xl font-bold text-blue-900 mb-1">' + Object.keys(grouped).length + '</div>' +
                '<div class="text-sm text-blue-700">Total test groups</div>' +
              '</div>' +
              '<div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center">' +
                '<svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">' +
                  '<path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>' +
                '</svg>' +
              '</div>' +
            </div>' +
          '</div>' +
          '<div class="bg-purple-50 border border-purple-200 rounded-lg p-6 flex-1 min-w-64 shadow-sm">' +
            '<div class="flex items-center justify-between">' +
              '<div>' +
                '<h3 class="text-sm font-medium text-purple-800 mb-2">Total Duration</h3>' +
                '<div class="text-4xl font-bold text-purple-900 mb-1" id="total-duration">' + calculateTotalDuration() + '</div>' +
                '<div class="text-sm text-purple-700">Complete test execution time</div>' +
              '</div>' +
              '<div class="w-12 h-12 bg-purple-500 rounded-full flex items-center justify-center">' +
                '<svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">' +
                  '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path>' +
                '</svg>' +
              '</div>' +
            </div>' +
          '</div>' +
        '</div>' +
        '<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">' +
          '<h3 class="text-lg font-semibold text-gray-900 mb-4">Overall Progress</h3>' +
          '<div class="flex items-center justify-between mb-2">' +
            '<span class="text-sm font-medium text-gray-700">Pass Rate</span>' +
            '<span class="text-sm text-gray-600">' + passed + ' of ' + total + ' tests passed</span>' +
          '</div>' +
          '<div class="w-full bg-gray-200 rounded-full h-3">' +
            '<div class="bg-gradient-to-r from-green-400 to-green-600 h-3 rounded-full transition-all duration-500" style="width: ' + passPercent + '%"></div>' +
          '</div>' +
        '</div>' +
        '<div class="bg-white rounded-lg shadow-sm border border-gray-200">' +
          '<div class="px-6 py-4 border-b border-gray-200">' +
            '<h3 class="text-lg font-semibold text-gray-900">All Tests Overview</h3>' +
            '<p class="text-sm text-gray-600 mt-1">Complete list of all executed tests with their status</p>' +
          '</div>' +
          '<div class="p-6">' +
            '<div id="overview-tests-table" class="table-container">' +
              '<!-- Overview tests table will be populated here -->' +
            '</div>' +
          '</div>' +
        '</div>';
      
      // Populate the overview tests table
      initializeOverviewTestsTable();
    }
    
    function initializeOverviewTestsTable() {
      const overviewTestsDiv = document.getElementById("overview-tests-table");
      let tableHTML = '<table class="min-w-full divide-y divide-gray-200">' +
        '<thead class="bg-gray-50">' +
          '<tr>' +
            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Test Name</th>' +
            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Suite</th>' +
            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>' +
            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Duration</th>' +
            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Error Summary</th>' +
          '</tr>' +
        '</thead>' +
        '<tbody class="bg-white divide-y divide-gray-200">';

      testData.results.forEach((test, index) => {
        const statusClass = test.status === "passed" ? "status-passed" : "status-failed";
        const statusText = test.status === "passed" ? "✅ Passed" : "❌ Failed";
        const rowClass = test.status === "passed" ? "bg-green-50" : "bg-red-50";
        
        // Calculate actual duration from test data
        let duration = "N/A";
        if (test.duration !== undefined && test.duration !== null) {
          const durationMs = test.duration;
          const durationSeconds = durationMs / 1000; // Keep decimal precision
          
          if (durationSeconds < 60) {
            duration = durationSeconds.toFixed(1) + "s";
          } else if (durationSeconds < 3600) {
            const minutes = Math.floor(durationSeconds / 60);
            const seconds = (durationSeconds % 60).toFixed(1);
            duration = minutes + "m " + seconds + "s";
          } else {
            const hours = Math.floor(durationSeconds / 3600);
            const minutes = Math.floor((durationSeconds % 3600) / 60);
            const seconds = (durationSeconds % 60).toFixed(1);
            duration = hours + "h " + minutes + "m " + seconds + "s";
          }
        } else {
          // Fallback estimate if duration is not available
          duration = "~4s";
        }
        
        // Format error summary
        let errorSummary = '';
        if (test.status === "failed") {
          if (test.expectFailed && Array.isArray(test.expectFailed) && test.expectFailed.length > 0) {
            errorSummary = test.expectFailed.length + ' expectation' + (test.expectFailed.length !== 1 ? 's' : '') + ' failed';
          } else if (test.reason) {
            const firstLine = test.reason.split('\n')[0];
            errorSummary = firstLine.length > 50 ? firstLine.substring(0, 50) + '...' : firstLine;
          } else {
            errorSummary = 'Test failed';
          }
        } else {
          errorSummary = '-';
        }

        tableHTML += '<tr class="' + rowClass + '">' +
          '<td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">' + test.testName + '</td>' +
          '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">' + test.suite + '</td>' +
          '<td class="px-6 py-4 whitespace-nowrap">' +
            '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' +
          '</td>' +
          '<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">' + duration + '</td>' +
          '<td class="px-6 py-4 text-sm text-gray-500">' + errorSummary + '</td>' +
        '</tr>';
      });

      tableHTML += '</tbody></table>';
      overviewTestsDiv.innerHTML = tableHTML;
    }
    
    
    function initializeTestsTable() {
      const testsTableDiv = document.getElementById("tests-table");
      let tableHTML = '<table class="min-w-full divide-y divide-gray-200">' +
        '<thead class="bg-gray-50">' +
          '<tr>' +
            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Test Name</th>' +
            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Suite</th>' +
            '<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>' +
